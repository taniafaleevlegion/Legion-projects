name: Test generation

on:
  schedule:
    # Weekdays at 06:00 UTC (GitHub Actions cron is UTC only)
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: dev1
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Work the backlog, or self-heal when it is empty
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_BASE_URL: ${{ secrets.ATLASSIAN_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          agent -p --force --trust --output-format text "$(cat <<'EOF'
          Work the In Progress backlog. Queue DS tickets in status "In Progress" that do not already have the tests-generated label. Budget: 5 tickets. For each ticket, analyze it, write a conforming Playwright spec under tests/, run that spec, open a pull request linked to the ticket, and add the tests-generated label. Never merge.

          An empty queue is not a successful exit. When no DS ticket is ready to work on, self-heal the existing suite:

          1. Run `npx playwright test`.
          2. If the run is green, report that and stop.
          3. If the run is red, follow Heal on red in .cursor/rules/qa-orchestration.mdc. Delegate to triage first. Apply .cursor/skills/self-heal/SKILL.md only when triage classifies the failure as locator drift (a test issue): one drifted Page Object locator, assertions unchanged, re-run to prove green, then open one repair pull request linked to the run. A real app bug goes to bug-reporter. Never heal a bug, never heal an assertion, and never merge.
          EOF
          )"

      - name: Refresh reliability report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/eval-report.mjs

      - name: Commit reliability report
        if: always()
        run: |
          git add eval-report.md
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update reliability report after test generation."
          git push

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.md
          retention-days: 7
