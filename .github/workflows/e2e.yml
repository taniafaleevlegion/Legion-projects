name: E2E Tests

on:
  # Sanity: every push to main.
  push:
    branches: [main]
    paths-ignore:
      - eval-report.md
  # Smoke: every pull request.
  pull_request:
  # Regression: the full default suite, only when someone starts the workflow.
  workflow_dispatch:

jobs:
  test:
    name: ${{ github.event_name == 'pull_request' && 'Smoke' || github.event_name == 'workflow_dispatch' && 'Regression' || 'Sanity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Select suite
        id: suite
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "script=test:smoke" >> "$GITHUB_OUTPUT"
            echo "label=smoke" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "script=test" >> "$GITHUB_OUTPUT"
            echo "label=regression" >> "$GITHUB_OUTPUT"
          else
            echo "script=test:sanity" >> "$GITHUB_OUTPUT"
            echo "label=sanity" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ${{ steps.suite.outputs.label }}
        run: npm run ${{ steps.suite.outputs.script }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
